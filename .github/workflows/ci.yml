name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify the verification tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Portable architecture, builds and tests
        run: python3 tools/verify.py
      # Proprietary game DLLs are not available on this runner. This job does
      # not claim Core/Tools/FastBoot or live multiplayer verification.
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-results
          path: .artifacts/verification/**/*.trx
          if-no-files-found: warn
          retention-days: 14
