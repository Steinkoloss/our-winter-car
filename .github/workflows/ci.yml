name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Only the engine-independent projects build without the game's DLLs:
      # WinterMP.Net (protocol), its tests, and the Avalonia launcher. The in-game
      # plugins (WinterMP.Core / .Tools / .FastBoot) need a real My Winter Car install
      # and are intentionally not built here.
      - name: Restore
        run: |
          dotnet restore src/WinterMP.Net/WinterMP.Net.csproj
          dotnet restore src/WinterMP.Net.Tests/WinterMP.Net.Tests.csproj
          dotnet restore src/WinterMP.Launcher/WinterMP.Launcher.csproj
          dotnet restore src/WinterMP.Launcher.Tests/WinterMP.Launcher.Tests.csproj

      # Builds both target frameworks (net35 + netstandard2.0) so a net35-only
      # compile break is caught even though the tests run on net8.
      - name: Build protocol (net35 + netstandard2.0)
        run: dotnet build src/WinterMP.Net/WinterMP.Net.csproj -c Release --no-restore

      - name: Build launcher (net8, Avalonia)
        run: dotnet build src/WinterMP.Launcher/WinterMP.Launcher.csproj -c Release --no-restore

      - name: Run protocol unit tests
        run: dotnet test src/WinterMP.Net.Tests/WinterMP.Net.Tests.csproj -c Release --no-restore --verbosity normal

      # Guards the FastBoot production profile: the save-corrupting ES2 tiers must stay off.
      - name: Run launcher unit tests
        run: dotnet test src/WinterMP.Launcher.Tests/WinterMP.Launcher.Tests.csproj -c Release --no-restore --verbosity normal
